<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tracker Scribe</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0d10;
      color: #f3f4f6;
      margin: 0;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 480px; }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .accent-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #e11d48;
      border-radius: 50%;
      margin-left: 6px;
      box-shadow: 0 0 8px #e11d48;
    }

    /* Mode Pill Selector */
    .mode-selector {
      display: flex;
      background: #14171d;
      border: 1px solid #232733;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #9ca3af;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .mode-btn.active {
      background: #232733;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .mode-btn.active.coach {
      color: #fb7185;
    }

    /* Main Card */
    .input-card {
      background: #14171d;
      border: 1px solid #232733;
      padding: 20px 16px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    /* Action Buttons Row */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    #micBtn {
      padding: 16px 12px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background: #e11d48;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
      transition: all 0.15s ease;
    }
    #micBtn.recording { background: #991b1b; animation: pulse 1.2s infinite; }

    .photo-label {
      padding: 16px 12px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background: #1f242f;
      border: 1px solid #323846;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-sizing: border-box;
      transition: all 0.15s ease;
    }
    .photo-label:active { background: #282f3e; }
    input[type="file"] { display: none; }

    /* Photo Preview Thumbnail */
    #photoPreviewContainer {
      display: none;
      position: relative;
      margin-bottom: 12px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #374151;
      max-height: 180px;
    }
    #photoPreview { width: 100%; height: 180px; object-fit: cover; display: block; }
    #removePhotoBtn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Text Area */
    textarea {
      width: 100%;
      height: 95px;
      padding: 12px;
      border: 1px solid #272b38;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.4;
      background: #0d0f13;
      color: #f3f4f6;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #e11d48; }
    textarea::placeholder { color: #4b5563; }

    #submitBtn {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      background: #1f232d;
      color: #f3f4f6;
      border: 1px solid #303544;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    #submitBtn.ready-send {
      background: #e11d48;
      border-color: #e11d48;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Status Banner */
    #status {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      display: none;
      white-space: pre-wrap;
    }
    .status-loading { display: block !important; background: #2b2114; color: #fde047; border: 1px solid #4a3810; }
    .status-success { display: block !important; background: #11261d; color: #4ade80; border: 1px solid #17452d; }
    .status-error { display: block !important; background: #311317; color: #fb7185; border: 1px solid #5a1c24; }

    /* Coach Review Card */
    #coachReviewCard {
      display: none;
      margin-top: 16px;
      background: #1a1216;
      border: 1px solid #881337;
      padding: 16px;
      border-radius: 12px;
    }
    .coach-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #fb7185;
      margin-bottom: 8px;
    }
    .coach-text { font-size: 14px; color: #fff1f2; line-height: 1.45; margin-bottom: 14px; }
    #confirmWriteBtn {
      width: 100%;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Collapsible Dashboard */
    .toggle-btn {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: transparent;
      color: #9ca3af;
      border: 1px dashed #2b303d;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    #dashboardSection { display: none; margin-top: 14px; }
    .stats-card {
      background: #14171d;
      border: 1px solid #232733;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .stats-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #e11d48;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .stats-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stats-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
    .stats-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
    .stat-box {
      background: #0d0f13;
      padding: 8px 4px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #1a1e27;
    }
    .stat-val { font-size: 15px; font-weight: 700; color: #f9fafb; }
    .stat-val.highlight { color: #fb7185; }
    .stat-lbl { font-size: 9px; color: #8b92a1; text-transform: uppercase; margin-top: 2px; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Tracker Scribe<span class="accent-dot"></span></h1>
      <span style="font-size: 13px; color: #8b92a1;">Today</span>
    </div>

    <!-- Mode Selector -->
    <div class="mode-selector">
      <button class="mode-btn active" id="modeQuick" onclick="setMode('quick')">⚡ Quick Log</button>
      <button class="mode-btn" id="modeCoach" onclick="setMode('coach')">💬 Review & Coach</button>
    </div>

    <!-- Input Card -->
    <div class="input-card">
      <div class="action-grid">
        <button id="micBtn" type="button" onclick="toggleRecord()">🎙️ Voice Note</button>
        <label class="photo-label">
          <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handlePhotoSelect(this)">
          📸 Take Photo
        </label>
      </div>

      <!-- Live Photo Preview -->
      <div id="photoPreviewContainer">
        <img id="photoPreview" src="" alt="Meal preview">
        <button id="removePhotoBtn" type="button" onclick="clearPhoto()">✕ Remove</button>
      </div>

      <textarea id="logInput" placeholder="Add details or type entry (e.g. 500 mL water, oats at 8:30)..."></textarea>
      
      <button id="submitBtn" type="button" onclick="submitEntry()">Send to Sheet</button>

      <div id="status"></div>

      <!-- Coach Mode Review / Confirmation -->
      <div id="coachReviewCard">
        <div class="coach-title">💬 Gemini Review & Coaching</div>
        <div class="coach-text" id="coachText"></div>
        <button id="confirmWriteBtn" type="button" onclick="confirmWriteToSheet()">✅ Confirm & Log to Sheet</button>
      </div>
    </div>

    <!-- Collapsible Dashboard -->
    <button class="toggle-btn" id="toggleBtn" onclick="toggleDashboard()">
      <span>📊</span> <span id="toggleText">View Today's Stats</span>
    </button>

    <div id="dashboardSection">
      <div class="stats-card">
        <div class="stats-title">
          <span>Nutrition & Hydration</span>
          <span id="syncStatus" style="color: #6b7280; font-size: 10px;">Live</span>
        </div>
        <div class="stats-grid-4">
          <div class="stat-box"><div class="stat-val highlight" id="valCalories">-</div><div class="stat-lbl">Calories</div></div>
          <div class="stat-box"><div class="stat-val" id="valProtein">-</div><div class="stat-lbl">Protein</div></div>
          <div class="stat-box"><div class="stat-val" id="valCarbs">-</div><div class="stat-lbl">Carbs</div></div>
          <div class="stat-box"><div class="stat-val" id="valFat">-</div><div class="stat-lbl">Fat</div></div>
        </div>
        <div class="stats-grid-2">
          <div class="stat-box"><div class="stat-val" id="valWater">-</div><div class="stat-lbl">Water (L)</div></div>
          <div class="stat-box"><div class="stat-val" id="valCoffee">-</div><div class="stat-lbl">Coffees</div></div>
        </div>
      </div>

      <div class="stats-card">
        <div class="stats-title"><span>Vitals & Baseline</span></div>
        <div class="stats-grid-3">
          <div class="stat-box"><div class="stat-val" id="valSleep">-</div><div class="stat-lbl">Sleep</div></div>
          <div class="stat-box"><div class="stat-val" id="valWeight">-</div><div class="stat-lbl">Weight</div></div>
          <div class="stat-box"><div class="stat-val" id="valSteps">-</div><div class="stat-lbl">Steps</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPKUPfGutBNhtfcy5PJaZYMQhX36mTYsWIfwcSccIgXZNoQg6aOAffgakFatTbti5p/exec";

    let currentMode = "quick";
    let selectedImageBase64 = null;
    let selectedImageMime = "image/jpeg";
    let pendingParsedData = null;
    
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let dashboardVisible = false;

    function setMode(mode) {
      currentMode = mode;
      document.getElementById("modeQuick").className = "mode-btn" + (mode === "quick" ? " active" : "");
      document.getElementById("modeCoach").className = "mode-btn" + (mode === "coach" ? " active coach" : "");
      document.getElementById("submitBtn").innerText = mode === "quick" ? "Send to Sheet" : "Review with Gemini";
      document.getElementById("coachReviewCard").style.display = "none";
    }

    function handlePhotoSelect(input) {
      const file = input.files[0];
      if (!file) return;

      selectedImageMime = file.type || "image/jpeg";
      const reader = new FileReader();
      reader.onloadend = function() {
        selectedImageBase64 = reader.result.split(',')[1];
        document.getElementById("photoPreview").src = reader.result;
        document.getElementById("photoPreviewContainer").style.display = "block";
        document.getElementById("submitBtn").classList.add("ready-send");
      };
      reader.readAsDataURL(file);
    }

    function clearPhoto() {
      selectedImageBase64 = null;
      document.getElementById("cameraInput").value = "";
      document.getElementById("photoPreviewContainer").style.display = "none";
      document.getElementById("photoPreview").src = "";
    }

    async function toggleRecord() {
      if (isRecording) stopRecording();
      else startRecording();
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        let mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported('audio/webm') && MediaRecorder.isTypeSupported('audio/mp4')) {
          mimeType = 'audio/mp4';
        }
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
        audioChunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          sendEntry({ audioBlob: blob });
        };

        mediaRecorder.start();
        isRecording = true;
        const btn = document.getElementById("micBtn");
        btn.innerText = "⏹️ Stop Audio";
        btn.classList.add("recording");
        showStatus("loading", "🔴 Recording voice... Speak naturally.");
      } catch (err) {
        showStatus("error", "⚠️ Microphone error: " + err.message);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      isRecording = false;
      const btn = document.getElementById("micBtn");
      btn.innerText = "🎙️ Voice Note";
      btn.classList.remove("recording");
    }

    function submitEntry() {
      const text = document.getElementById("logInput").value.trim();
      if (!text && !selectedImageBase64) {
        showStatus("error", "⚠️ Please enter text, record voice, or take a photo.");
        return;
      }
      sendEntry({ text: text });
    }

    async function sendEntry(payload) {
      showStatus("loading", "⏳ Processing with Gemini (" + (currentMode === "quick" ? "Direct Logging" : "Coach Mode") + ")...");
      document.getElementById("coachReviewCard").style.display = "none";

      try {
        let body = { mode: currentMode };

        if (payload.text) body.text = payload.text;
        if (selectedImageBase64) {
          body.image = selectedImageBase64;
          body.imageMimeType = selectedImageMime;
        }

        if (payload.audioBlob) {
          const reader = new FileReader();
          body.audio = await new Promise(res => {
            reader.onloadend = () => res(reader.result.split(',')[1]);
            reader.readAsDataURL(payload.audioBlob);
          });
          body.audioMimeType = payload.audioBlob.type.split(';')[0] || 'audio/webm';
        }

        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (data.status === "success") {
          if (currentMode === "quick") {
            showStatus("success", "✅ " + data.message);
            resetInputs();
            if (dashboardVisible) fetchStats();
          } else {
            // Coach mode: display review card
            showStatus("success", "✅ Gemini reviewed your entry.");
            pendingParsedData = data.parsed;
            document.getElementById("coachText").innerText = data.followUp;
            document.getElementById("coachReviewCard").style.display = "block";
          }
        } else {
          showStatus("error", "❌ " + data.message);
        }
      } catch (err) {
        showStatus("error", "❌ Network error: " + err.message);
      }
    }

    async function confirmWriteToSheet() {
      if (!pendingParsedData) return;
      showStatus("loading", "⏳ Writing confirmed data to your spreadsheet...");

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "confirmWrite", parsed: pendingParsedData })
        });
        const data = await res.json();

        if (data.status === "success") {
          showStatus("success", "✅ " + data.message);
          document.getElementById("coachReviewCard").style.display = "none";
          resetInputs();
          if (dashboardVisible) fetchStats();
        } else {
          showStatus("error", "❌ Error: " + data.message);
        }
      } catch (err) {
        showStatus("error", "❌ Error: " + err.message);
      }
    }

    function resetInputs() {
      document.getElementById("logInput").value = "";
      clearPhoto();
      pendingParsedData = null;
    }

    function toggleDashboard() {
      dashboardVisible = !dashboardVisible;
      const dash = document.getElementById("dashboardSection");
      document.getElementById("toggleText").innerText = dashboardVisible ? "Hide Today's Stats" : "View Today's Stats";
      dash.style.display = dashboardVisible ? "block" : "none";
      if (dashboardVisible) fetchStats();
    }

    async function fetchStats() {
      try {
        const res = await fetch(SCRIPT_URL + "?action=getStats");
        const stats = await res.json();
        document.getElementById("valCalories").innerText = stats.calories;
        document.getElementById("valProtein").innerText = stats.protein + "g";
        document.getElementById("valCarbs").innerText = stats.carbs + "g";
        document.getElementById("valFat").innerText = stats.fat + "g";
        document.getElementById("valWater").innerText = stats.water;
        document.getElementById("valCoffee").innerText = stats.coffee;
        document.getElementById("valSleep").innerText = stats.sleep ? stats.sleep + "h" : "-";
        document.getElementById("valWeight").innerText = stats.weight || "-";
        document.getElementById("valSteps").innerText = stats.steps || "-";
      } catch (e) {}
    }

    function showStatus(type, msg) {
      const status = document.getElementById("status");
      status.className = "status-" + type;
      status.innerText = msg;
    }
  </script>
</body>
</html>
