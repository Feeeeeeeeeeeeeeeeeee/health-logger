<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tracker Scribe</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0d10;
      color: #f3f4f6;
      margin: 0;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 480px; }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .accent-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #e11d48;
      border-radius: 50%;
      margin-left: 6px;
      box-shadow: 0 0 8px #e11d48;
    }

    /* Mode & Global Review Controls */
    .controls-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-selector {
      flex: 1;
      display: flex;
      background: #14171d;
      border: 1px solid #232733;
      border-radius: 10px;
      padding: 3px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 6px;
      border: none;
      background: transparent;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }
    .mode-btn.active {
      background: #232733;
      color: #ffffff;
    }
    .mode-btn.active.prep { color: #38bdf8; }

    /* Review Toggle Button */
    .review-toggle-btn {
      padding: 8px 12px;
      background: #14171d;
      border: 1px solid #232733;
      border-radius: 10px;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .review-toggle-btn.active {
      border-color: #e11d48;
      color: #fb7185;
      background: #1e1317;
    }

    /* Active Preps Chips Row */
    .preps-container {
      margin-bottom: 14px;
      background: #14171d;
      border: 1px solid #232733;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .preps-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .chips-scroll {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      background: #1e232d;
      border: 1px solid #333a4a;
      border-radius: 20px;
      padding: 6px 10px 6px 12px;
      font-size: 13px;
      font-weight: 500;
      color: #f3f4f6;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .chip:hover { border-color: #38bdf8; }
    .chip-date {
      font-size: 11px;
      color: #94a3b8;
      background: #0d0f13;
      padding: 2px 6px;
      border-radius: 10px;
    }
    .chip-del {
      color: #ef4444;
      font-weight: bold;
      font-size: 14px;
      padding: 0 4px;
      cursor: pointer;
    }

    /* Main Card */
    .input-card {
      background: #14171d;
      border: 1px solid #232733;
      padding: 18px 14px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    #micBtn {
      padding: 15px 10px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background: #e11d48;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
    }
    #micBtn.recording { background: #991b1b; animation: pulse 1.2s infinite; }
    .photo-label {
      padding: 15px 10px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background: #1f242f;
      border: 1px solid #323846;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    input[type="file"] { display: none; }

    #photoPreviewContainer {
      display: none;
      position: relative;
      margin-bottom: 12px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #374151;
      max-height: 160px;
    }
    #photoPreview { width: 100%; height: 160px; object-fit: cover; display: block; }
    #removePhotoBtn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 12px;
      border: 1px solid #272b38;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.4;
      background: #0d0f13;
      color: #f3f4f6;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #e11d48; }

    #submitBtn {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: #1f232d;
      color: #f3f4f6;
      border: 1px solid #303544;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    #submitBtn.prep-active {
      background: #0284c7;
      border-color: #0284c7;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      display: none;
      white-space: pre-wrap;
    }
    .status-loading { display: block !important; background: #2b2114; color: #fde047; border: 1px solid #4a3810; }
    .status-success { display: block !important; background: #11261d; color: #4ade80; border: 1px solid #17452d; }
    .status-error { display: block !important; background: #311317; color: #fb7185; border: 1px solid #5a1c24; }

    /* EDITABLE REVIEW CARD */
    #reviewCard {
      display: none;
      margin-top: 16px;
      background: #161a22;
      border: 1px solid #2f3647;
      padding: 16px;
      border-radius: 12px;
    }
    .review-header {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #fb7185;
      margin-bottom: 10px;
    }
    .review-transcript-box {
      background: #0d0f13;
      border: 1px solid #272b38;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
      outline: none;
    }
    .review-transcript-box:focus { border-color: #38bdf8; color: #f3f4f6; }
    .edit-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .edit-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .edit-field label {
      font-size: 10px;
      text-transform: uppercase;
      color: #9ca3af;
      font-weight: 600;
    }
    .edit-field input {
      background: #0d0f13;
      border: 1px solid #272b38;
      border-radius: 6px;
      padding: 8px 4px;
      color: #fff;
      font-size: 14px;
      text-align: center;
      outline: none;
    }
    .edit-field input:focus { border-color: #e11d48; }

    #confirmWriteBtn {
      width: 100%;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Collapsible Dashboard */
    .toggle-btn {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: transparent;
      color: #9ca3af;
      border: 1px dashed #2b303d;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    #dashboardSection { display: none; margin-top: 14px; }
    .stats-card {
      background: #14171d;
      border: 1px solid #232733;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .stats-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #e11d48;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .stats-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stats-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
    .stat-box {
      background: #0d0f13;
      padding: 8px 4px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #1a1e27;
    }
    .stat-val { font-size: 15px; font-weight: 700; color: #f9fafb; }
    .stat-val.highlight { color: #fb7185; }
    .stat-lbl { font-size: 9px; color: #8b92a1; text-transform: uppercase; margin-top: 2px; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Tracker Scribe<span class="accent-dot"></span></h1>
      <span style="font-size: 13px; color: #8b92a1;">Today</span>
    </div>

    <!-- Controls Row: Mode Selector + Global Review Toggle -->
    <div class="controls-row">
      <div class="mode-selector">
        <button class="mode-btn active" id="modeLog" onclick="setMode('log')">⚡ Daily Log</button>
        <button class="mode-btn" id="modePrep" onclick="setMode('prep')">🍱 Meal Prep</button>
      </div>
      <button class="review-toggle-btn active" id="reviewToggleBtn" onclick="toggleReview()">
        <span>👁️ Review</span> <span id="reviewStatusText">ON</span>
      </button>
    </div>

    <!-- Active Meal Prep Chips -->
    <div class="preps-container" id="prepsContainer" style="display: none;">
      <div class="preps-label">
        <span>Active Fridge Preps (Tap to Log 1 Portion)</span>
      </div>
      <div class="chips-scroll" id="prepsList"></div>
    </div>

    <!-- Input Card -->
    <div class="input-card">
      <div class="action-grid">
        <button id="micBtn" type="button" onclick="toggleRecord()">🎙️ Voice Note</button>
        <label class="photo-label">
          <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handlePhotoSelect(this)">
          📸 Take Photo
        </label>
      </div>

      <div id="photoPreviewContainer">
        <img id="photoPreview" src="" alt="Meal preview">
        <button id="removePhotoBtn" type="button" onclick="clearPhoto()">✕ Remove</button>
      </div>

      <textarea id="logInput" placeholder="Describe entry or dictate details..."></textarea>
      
      <button id="submitBtn" type="button" onclick="submitEntry()">Send to Sheet</button>

      <div id="status"></div>

      <!-- EDITABLE REVIEW CARD -->
      <div id="reviewCard">
        <div class="review-header">📝 Review & Edit Before Logging</div>
        
        <label style="font-size: 10px; color: #94a3b8; text-transform: uppercase;">Transcript / Heard Notes</label>
        <div class="review-transcript-box" id="reviewTranscript" contenteditable="true"></div>

        <div id="editableItemsContainer"></div>

        <button id="confirmWriteBtn" type="button" onclick="confirmWriteToSheet()">✅ Confirm & Log to Sheet</button>
      </div>
    </div>

    <!-- Collapsible Dashboard -->
    <button class="toggle-btn" id="toggleBtn" onclick="toggleDashboard()">
      <span>📊</span> <span id="toggleText">View Today's Stats</span>
    </button>

    <div id="dashboardSection">
      <div class="stats-card">
        <div class="stats-title">
          <span>Nutrition & Hydration</span>
          <span id="syncStatus" style="color: #6b7280; font-size: 10px;">Live</span>
        </div>
        <div class="stats-grid-4">
          <div class="stat-box"><div class="stat-val highlight" id="valCalories">-</div><div class="stat-lbl">Calories</div></div>
          <div class="stat-box"><div class="stat-val" id="valProtein">-</div><div class="stat-lbl">Protein</div></div>
          <div class="stat-box"><div class="stat-val" id="valCarbs">-</div><div class="stat-lbl">Carbs</div></div>
          <div class="stat-box"><div class="stat-val" id="valFat">-</div><div class="stat-lbl">Fat</div></div>
        </div>
        <div class="stats-grid-2">
          <div class="stat-box"><div class="stat-val" id="valWater">-</div><div class="stat-lbl">Water (L)</div></div>
          <div class="stat-box"><div class="stat-val" id="valCoffee">-</div><div class="stat-lbl">Coffees</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPKUPfGutBNhtfcy5PJaZYMQhX36mTYsWIfwcSccIgXZNoQg6aOAffgakFatTbti5p/exec";

    let currentMode = "log"; // "log" or "prep"
    let reviewEnabled = true;
    let selectedImageBase64 = null;
    let selectedImageMime = "image/jpeg";
    let pendingParsedData = null;
    let loadedPresets = [];
    
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let dashboardVisible = false;

    window.addEventListener("DOMContentLoaded", () => {
      fetchPresets();
    });

    function setMode(mode) {
      currentMode = mode;
      document.getElementById("modeLog").className = "mode-btn" + (mode === "log" ? " active" : "");
      document.getElementById("modePrep").className = "mode-btn" + (mode === "prep" ? " active prep" : "");
      
      const submitBtn = document.getElementById("submitBtn");
      if (mode === "prep") {
        submitBtn.innerText = "Save to Meal Presets";
        submitBtn.classList.add("prep-active");
        document.getElementById("logInput").placeholder = "e.g. Cooked 1.2kg chicken thighs, 4c rice, broccoli. 5 portions.";
      } else {
        submitBtn.innerText = reviewEnabled ? "Review Entry" : "Send to Sheet";
        submitBtn.classList.remove("prep-active");
        document.getElementById("logInput").placeholder = "Describe entry or dictate details...";
      }
      document.getElementById("reviewCard").style.display = "none";
    }

    function toggleReview() {
      reviewEnabled = !reviewEnabled;
      const btn = document.getElementById("reviewToggleBtn");
      const text = document.getElementById("reviewStatusText");
      btn.className = "review-toggle-btn" + (reviewEnabled ? " active" : "");
      text.innerText = reviewEnabled ? "ON" : "OFF";
      if (currentMode === "log") {
        document.getElementById("submitBtn").innerText = reviewEnabled ? "Review Entry" : "Send to Sheet";
      }
    }

    async function fetchPresets() {
      try {
        const res = await fetch(SCRIPT_URL + "?action=getPresets");
        loadedPresets = await res.json();
        renderPresetChips();
      } catch (e) {
        console.error("Presets error", e);
      }
    }

    function renderPresetChips() {
      const container = document.getElementById("prepsContainer");
      const list = document.getElementById("prepsList");
      list.innerHTML = "";

      if (!loadedPresets || loadedPresets.length === 0) {
        container.style.display = "none";
        return;
      }

      container.style.display = "block";
      loadedPresets.forEach(p => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.innerHTML = `
          <span onclick="logPresetDirectly('${p.name}')">🍗 ${p.name}</span>
          <span class="chip-date">${p.dateCreated || "Prep"}</span>
          <span class="chip-del" onclick="deletePreset(event, '${p.name}')">✕</span>
        `;
        list.appendChild(chip);
      });
    }

    async function logPresetDirectly(presetName) {
      const preset = loadedPresets.find(p => p.name === presetName);
      if (!preset) return;

      showStatus("loading", `⏳ Logging 1 portion of ${preset.name}...`);
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "quickAddPreset", preset: preset })
        });
        const data = await res.json();
        showStatus("success", "✅ " + data.message);
        if (dashboardVisible) fetchStats();
      } catch (err) {
        showStatus("error", "❌ " + err.message);
      }
    }

    async function deletePreset(e, presetName) {
      e.stopPropagation();
      if (!confirm(`Remove "${presetName}" from active preps?`)) return;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "deletePreset", presetName: presetName })
        });
        loadedPresets = loadedPresets.filter(p => p.name !== presetName);
        renderPresetChips();
      } catch (err) {
        alert("Failed to delete preset: " + err.message);
      }
    }

    function handlePhotoSelect(input) {
      const file = input.files[0];
      if (!file) return;

      selectedImageMime = file.type || "image/jpeg";
      const reader = new FileReader();
      reader.onloadend = function() {
        selectedImageBase64 = reader.result.split(',')[1];
        document.getElementById("photoPreview").src = reader.result;
        document.getElementById("photoPreviewContainer").style.display = "block";
      };
      reader.readAsDataURL(file);
    }

    function clearPhoto() {
      selectedImageBase64 = null;
      document.getElementById("cameraInput").value = "";
      document.getElementById("photoPreviewContainer").style.display = "none";
      document.getElementById("photoPreview").src = "";
    }

    async function toggleRecord() {
      if (isRecording) stopRecording();
      else startRecording();
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        let mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported('audio/webm') && MediaRecorder.isTypeSupported('audio/mp4')) {
          mimeType = 'audio/mp4';
        }
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
        audioChunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          sendEntry({ audioBlob: blob });
        };

        mediaRecorder.start();
        isRecording = true;
        const btn = document.getElementById("micBtn");
        btn.innerText = "⏹️ Stop Audio";
        btn.classList.add("recording");
        showStatus("loading", "🔴 Recording voice... Speak naturally.");
      } catch (err) {
        showStatus("error", "⚠️ Microphone error: " + err.message);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      isRecording = false;
      const btn = document.getElementById("micBtn");
      btn.innerText = "🎙️ Voice Note";
      btn.classList.remove("recording");
    }

    function submitEntry() {
      const text = document.getElementById("logInput").value.trim();
      if (!text && !selectedImageBase64) {
        showStatus("error", "⚠️ Please enter text, record voice, or take a photo.");
        return;
      }
      sendEntry({ text: text });
    }

    async function sendEntry(payload) {
      showStatus("loading", `⏳ Processing with Gemini (${currentMode === "prep" ? "Meal Prep Mode" : (reviewEnabled ? "Review Mode" : "Direct Log")})...`);
      document.getElementById("reviewCard").style.display = "none";

      try {
        let body = { 
          mode: currentMode,
          review: reviewEnabled
        };

        if (payload.text) body.text = payload.text;
        if (selectedImageBase64) {
          body.image = selectedImageBase64;
          body.imageMimeType = selectedImageMime;
        }

        if (payload.audioBlob) {
          const reader = new FileReader();
          body.audio = await new Promise(res => {
            reader.onloadend = () => res(reader.result.split(',')[1]);
            reader.readAsDataURL(payload.audioBlob);
          });
          body.audioMimeType = payload.audioBlob.type.split(';')[0] || 'audio/webm';
        }

        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (data.status === "success") {
          if (currentMode === "prep") {
            showStatus("success", "✅ " + data.message);
            resetInputs();
            fetchPresets();
          } else if (!reviewEnabled) {
            showStatus("success", "✅ " + data.message);
            resetInputs();
            if (dashboardVisible) fetchStats();
          } else {
            // Review mode: Populate editable card
            showStatus("success", "✅ Parsed. Review & adjust numbers below before logging.");
            pendingParsedData = data.parsed;
            populateReviewCard(data.transcript, data.parsed);
          }
        } else {
          showStatus("error", "❌ " + data.message);
        }
      } catch (err) {
        showStatus("error", "❌ Network error: " + err.message);
      }
    }

    function populateReviewCard(transcript, parsed) {
      document.getElementById("reviewTranscript").innerText = transcript || "No spoken audio transcribed.";
      const itemsContainer = document.getElementById("editableItemsContainer");
      itemsContainer.innerHTML = "";

      if (parsed.intakeEvents && parsed.intakeEvents.length > 0) {
        parsed.intakeEvents.forEach((item, index) => {
          const box = document.createElement("div");
          box.style.marginBottom = "10px";
          box.innerHTML = `
            <div style="font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 6px;">
              <input type="text" value="${item.item || ''}" id="item_name_${index}" style="width: 100%; background: #0d0f13; border: 1px solid #272b38; padding: 6px 8px; color: white; border-radius: 6px;">
            </div>
            <div class="edit-grid">
              <div class="edit-field"><label>Kcal</label><input type="number" value="${item.calories || 0}" id="item_cal_${index}"></div>
              <div class="edit-field"><label>Prot</label><input type="number" value="${item.protein || 0}" id="item_pro_${index}"></div>
              <div class="edit-field"><label>Carb</label><input type="number" value="${item.carbs || 0}" id="item_carb_${index}"></div>
              <div class="edit-field"><label>Fat</label><input type="number" value="${item.fat || 0}" id="item_fat_${index}"></div>
            </div>
          `;
          itemsContainer.appendChild(box);
        });
      }

      document.getElementById("reviewCard").style.display = "block";
    }

    async function confirmWriteToSheet() {
      if (!pendingParsedData) return;

      // Extract user edits back into pendingParsedData
      if (pendingParsedData.intakeEvents && pendingParsedData.intakeEvents.length > 0) {
        pendingParsedData.intakeEvents.forEach((item, index) => {
          const nameInput = document.getElementById(`item_name_${index}`);
          const calInput = document.getElementById(`item_cal_${index}`);
          const proInput = document.getElementById(`item_pro_${index}`);
          const carbInput = document.getElementById(`item_carb_${index}`);
          const fatInput = document.getElementById(`item_fat_${index}`);

          if (nameInput) item.item = nameInput.value;
          if (calInput) item.calories = parseFloat(calInput.value) || 0;
          if (proInput) item.protein = parseFloat(proInput.value) || 0;
          if (carbInput) item.carbs = parseFloat(carbInput.value) || 0;
          if (fatInput) item.fat = parseFloat(fatInput.value) || 0;
        });
      }

      showStatus("loading", "⏳ Writing confirmed data to your spreadsheet...");

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "confirmWrite", parsed: pendingParsedData })
        });
        const data = await res.json();

        if (data.status === "success") {
          showStatus("success", "✅ " + data.message);
          document.getElementById("reviewCard").style.display = "none";
          resetInputs();
          if (dashboardVisible) fetchStats();
        } else {
          showStatus("error", "❌ Error: " + data.message);
        }
      } catch (err) {
        showStatus("error", "❌ Error: " + err.message);
      }
    }

    function resetInputs() {
      document.getElementById("logInput").value = "";
      clearPhoto();
      pendingParsedData = null;
    }

    function toggleDashboard() {
      dashboardVisible = !dashboardVisible;
      const dash = document.getElementById("dashboardSection");
      document.getElementById("toggleText").innerText = dashboardVisible ? "Hide Today's Stats" : "View Today's Stats";
      dash.style.display = dashboardVisible ? "block" : "none";
      if (dashboardVisible) fetchStats();
    }

    async function fetchStats() {
      try {
        const res = await fetch(SCRIPT_URL + "?action=getStats");
        const stats = await res.json();
        document.getElementById("valCalories").innerText = stats.calories;
        document.getElementById("valProtein").innerText = stats.protein + "g";
        document.getElementById("valCarbs").innerText = stats.carbs + "g";
        document.getElementById("valFat").innerText = stats.fat + "g";
        document.getElementById("valWater").innerText = stats.water;
        document.getElementById("valCoffee").innerText = stats.coffee;
      } catch (e) {}
    }

    function showStatus(type, msg) {
      const status = document.getElementById("status");
      status.className = "status-" + type;
      status.innerText = msg;
    }
  </script>
</body>
</html>
